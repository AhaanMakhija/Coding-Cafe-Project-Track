{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}

{% block content %}
  <div class="panel panel-narrow error-panel">
    <p class="eyebrow">Error {{ code }}</p>
    <h1>{{ heading }}</h1>
    <p>{{ message }}</p>
    <div class="btn-row">
      {% if current_user.is_authenticated %}
        <a class="btn" href="{{ url_for('resources.course_list') }}">Go to your courses</a>
      {% else %}
        <a class="btn" href="{{ url_for('auth.login') }}">Log in</a>
      {% endif %}
      <a href="{{ url_for('index') }}">Home page</a>
    </div>
  </div>
{% endblock %}
